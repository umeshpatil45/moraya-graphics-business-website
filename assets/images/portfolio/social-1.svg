<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/><stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="480" fill="url(#bg)"/>
  <rect width="600" height="480" fill="url(#grid)"/>

  <!-- CMYK Top Indicator Stripe -->
  <g opacity="0.8">
    <rect x="0" y="0" width="150" height="6" fill="#00AEEF"/>
    <rect x="150" y="0" width="150" height="6" fill="#EC008C"/>
    <rect x="300" y="0" width="150" height="6" fill="#FFF200"/>
    <rect x="450" y="0" width="150" height="6" fill="#231F20"/>
  </g>

  <!-- Watermark / Brand Badge -->
  <g transform="translate(450, 16)">
    <rect width="134" height="24" rx="12" fill="rgba(0,0,0,0.45)" stroke="#FFB703" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#FFB703"/>
    <text x="24" y="16" font-family="'Mukta', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">मोरया ग्राफिक्स</text>
  </g>

  <!-- Central Graphic Content -->
  <g transform="translate(300, 215)" filter="url(#shadow)">
    
      <circle cx="0" cy="-20" r="45" fill="rgba(255,255,255,0.15)"/>
      <polygon points="0,-40 10,-15 35,-15 15,3 22,28 0,14 -22,28 -15,3 -35,-15 -10,-15" fill="#FFB703"/>
      <text x="0" y="45" font-family="'Mukta', sans-serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle">हॉटेल व रेस्टॉरंट सोशल पोस्ट</text>
      <text x="0" y="65" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFD166" text-anchor="middle">INSTAGRAM 1:1 POST</text>
    
  </g>

  <!-- Bottom Labels Plate -->
  <g transform="translate(0, 400)">
    <rect width="600" height="80" fill="rgba(15, 5, 8, 0.75)"/>
    <rect width="600" height="3" fill="url(#accent)"/>
    <text x="24" y="36" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">हॉटेल व रेस्टॉरंट सोशल पोस्ट</text>
    <text x="24" y="60" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#FFD166" letter-spacing="1">Social Media</text>
    
    <!-- Quality Seal -->
    <g transform="translate(490, 18)">
      <circle cx="20" cy="20" r="18" fill="url(#accent)"/>
      <text x="20" y="24" font-family="'Poppins', sans-serif" font-size="9" font-weight="800" fill="#111" text-anchor="middle">HD PRINT</text>
    </g>
  </g>
</svg>