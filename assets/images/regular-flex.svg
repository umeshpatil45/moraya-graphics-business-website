<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/><stop offset="100%" stop-color="#500724"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="420" fill="url(#bg)"/>
  <rect width="600" height="420" fill="url(#grid)"/>

  <!-- CMYK Top Indicator Stripe -->
  <g opacity="0.8">
    <rect x="0" y="0" width="150" height="6" fill="#00AEEF"/>
    <rect x="150" y="0" width="150" height="6" fill="#EC008C"/>
    <rect x="300" y="0" width="150" height="6" fill="#FFF200"/>
    <rect x="450" y="0" width="150" height="6" fill="#231F20"/>
  </g>

  <!-- Watermark / Brand Badge -->
  <g transform="translate(450, 16)">
    <rect width="134" height="24" rx="12" fill="rgba(0,0,0,0.45)" stroke="#FFB703" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#FFB703"/>
    <text x="24" y="16" font-family="'Mukta', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">मोरया ग्राफिक्स</text>
  </g>

  <!-- Central Graphic Content -->
  <g transform="translate(300, 185)" filter="url(#shadow)">
    
          <rect x="-105" y="-65" width="210" height="120" rx="6" fill="#FFF" stroke="#E11D48" stroke-width="3"/>
          <rect x="-95" y="-55" width="190" height="100" fill="#FFF1F2"/>
          <circle cx="0" cy="-25" r="22" fill="#BE123C"/>
          <path d="M -8 -25 L -2 -18 L 8 -30" stroke="#FFF" stroke-width="3" fill="none"/>
          <text x="0" y="15" font-family="'Mukta', sans-serif" font-size="18" font-weight="800" fill="#881337" text-anchor="middle">इकोनॉमी फ्लेक्स प्रिंट</text>
          <text x="0" y="32" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#E11D48" text-anchor="middle">240-280 GSM • QUICK TURNAROUND</text>
        
  </g>

  <!-- Bottom Labels Plate -->
  <g transform="translate(0, 340)">
    <rect width="600" height="80" fill="rgba(15, 5, 8, 0.75)"/>
    <rect width="600" height="3" fill="url(#accent)"/>
    <text x="24" y="36" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">रेग्युलर फ्लेक्स प्रिंट</text>
    <text x="24" y="60" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#FFD166" letter-spacing="1">REGULAR FLEX PRINT</text>
    
    <!-- Quality Seal -->
    <g transform="translate(490, 18)">
      <circle cx="20" cy="20" r="18" fill="url(#accent)"/>
      <text x="20" y="24" font-family="'Poppins', sans-serif" font-size="9" font-weight="800" fill="#111" text-anchor="middle">HD PRINT</text>
    </g>
  </g>
</svg>